name: Dresser quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: dresser.spool
      - uses: actions/checkout@v4
        with:
          repository: codethread/millstrand
          ref: fb6c9057d594bfa4b5ea8531b9774b5e9a23a4b4
          path: millstrand
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: latest
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.2"
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y ripgrep
      - run: make all TEST_ALIAS=equivalence-published
        working-directory: dresser.spool
